          - generic [ref=e226]: "Demo: PDBbind v2020.R1"
          - generic [ref=e228]:
            - text: This data package includes the biomolecular complexes in PDBbind v.2020 that still remain in PDBbind v.2024. Importanly, the structural files for these complexes have been reprocessed using the new workflow employed for preparing PDBbind v.2024, ensuring higher quality than the original structure files in PDBbind v.2020. Besides, binding data and other relevant information for some complexes have been updated.
            - text: This data set is FREE to access to registered users of the PDBbind+ web site. This provides the users an opportunity to evaluate the newly processed structures before purchasing any newer release of the PDBbind database. Although this data set does not extend beyond PDBbind v.2020, its improved quality may lead to enhance performance in tasks such as model training.
