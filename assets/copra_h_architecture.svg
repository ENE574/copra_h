<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .panelTitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #111827; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #111827; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111827; }
      .math { font-family: "Times New Roman", Times, serif; font-size: 12px; fill: #111827; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #374151; }

      .panel { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 1.5; rx: 14; }
      .panelHeader { fill: #F3F4F6; stroke: #E5E7EB; stroke-width: 1.5; }

      .blockBlue { fill: #D9ECFF; stroke: #4A6FA5; stroke-width: 1.5; rx: 10; }
      .blockGreen { fill: #DFF3E3; stroke: #2E7D32; stroke-width: 1.5; rx: 10; }
      .blockGrey { fill: #EEF2FF; stroke: #374151; stroke-width: 1.5; rx: 10; }

      .htfPanel { fill: #FFF3E0; stroke: #F57C00; stroke-width: 2.5; rx: 14; }
      .htfSub { fill: #FFE0B2; stroke: #F57C00; stroke-width: 1.5; rx: 10; }
      .htfSub2 { fill: #FFCC80; stroke: #F57C00; stroke-width: 1.5; rx: 10; }
      .htfSub3 { fill: #FFB74D; stroke: #F57C00; stroke-width: 1.5; rx: 10; }

      .coformer { fill: #D6E4FF; stroke: #1E3A8A; stroke-width: 2; rx: 10; }
      .encoderLayer { fill: #E8F0FF; stroke: #1E3A8A; stroke-width: 1.2; rx: 8; }

      .legendBox { fill: #FFFFFF; stroke: #E5E7EB; stroke-width: 1.5; rx: 10; }

      .arrow { stroke: #4B5563; stroke-width: 2.2; fill: none; marker-end: url(#arrowHead); }
      .arrowThin { stroke: #4B5563; stroke-width: 1.7; fill: none; marker-end: url(#arrowHeadSmall); }
      .arrowDashed { stroke: #C2185B; stroke-width: 2.0; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrowHeadMag); }

      .bi { stroke: #F57C00; stroke-width: 2.6; fill: none; marker-start: url(#arrowHeadOrange); marker-end: url(#arrowHeadOrange); }
      .idx { stroke: #7E57C2; stroke-width: 2.0; fill: none; stroke-dasharray: 3 4; marker-end: url(#arrowHeadPurple); }

      .badge { fill: #F57C00; }
      .badgeText { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }

      .callout { fill: #F3E8FF; stroke: #7E57C2; stroke-width: 1.5; rx: 10; }
    </style>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F57C00" flood-opacity="0.35"/>
    </filter>

    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#4B5563" />
    </marker>
    <marker id="arrowHeadSmall" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4B5563" />
    </marker>
    <marker id="arrowHeadOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#F57C00" />
    </marker>
    <marker id="arrowHeadPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#7E57C2" />
    </marker>
    <marker id="arrowHeadMag" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#C2185B" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="800" y="44" text-anchor="middle" class="title">FIGURE 1: ARCHITECTURE OF OUR PROPOSED CoPRA-H MODEL</text>

  <!-- Panels -->
  <rect x="30" y="80" width="400" height="760" class="panel"/>
  <rect x="30" y="80" width="400" height="42" class="panelHeader"/>
  <text x="48" y="108" class="panelTitle">INPUTS &amp; PRECOMPUTED REPRESENTATIONS</text>

  <rect x="450" y="80" width="420" height="760" class="htfPanel" filter="url(#softGlow)"/>
  <rect x="450" y="80" width="420" height="42" class="panelHeader"/>
  <text x="468" y="108" class="panelTitle">HIERARCHICAL TRI-LEVEL FUSION (HTF)</text>
  <rect x="820" y="92" width="46" height="22" rx="6" class="badge"/>
  <text x="843" y="108" text-anchor="middle" class="badgeText">NOVEL</text>

  <rect x="890" y="80" width="430" height="760" class="panel"/>
  <rect x="890" y="80" width="430" height="42" class="panelHeader"/>
  <text x="908" y="108" class="panelTitle">CROSS-MODAL COMPLEX ENCODER</text>

  <rect x="1340" y="80" width="230" height="760" class="panel"/>
  <rect x="1340" y="80" width="230" height="42" class="panelHeader"/>
  <text x="1358" y="108" class="panelTitle">PREDICTION HEADS</text>

  <!-- Panel 1: Offline embeddings -->
  <rect x="55" y="150" width="350" height="290" class="blockBlue"/>
  <text x="70" y="175" class="label" font-weight="700">Precomputed Multi-Source Token Embeddings (Offline, 12 Sources)</text>
  <text x="70" y="196" class="tiny">Token-level embeddings per chain, padded in token space</text>

  <!-- Four groups with three tiles each -->
  <!-- Group labels -->
  <text x="70" y="230" class="small" font-weight="700">Protein Sequence (3×)</text>
  <text x="70" y="300" class="small" font-weight="700">Protein Structure (3×)</text>
  <text x="70" y="370" class="small" font-weight="700">RNA Sequence (3×)</text>
  <text x="70" y="440" class="small" font-weight="700">RNA Structure (3×)</text>

  <!-- Tiles: each row 3 -->
  <rect x="220" y="214" width="50" height="26" class="blockGrey"/>
  <rect x="275" y="214" width="50" height="26" class="blockGrey"/>
  <rect x="330" y="214" width="50" height="26" class="blockGrey"/>
  <text x="245" y="232" text-anchor="middle" class="tiny">esm2</text>
  <text x="300" y="232" text-anchor="middle" class="tiny">prott5</text>
  <text x="355" y="232" text-anchor="middle" class="tiny">saprot</text>

  <rect x="220" y="284" width="50" height="26" class="blockGrey"/>
  <rect x="275" y="284" width="50" height="26" class="blockGrey"/>
  <rect x="330" y="284" width="50" height="26" class="blockGrey"/>
  <text x="245" y="302" text-anchor="middle" class="tiny">esm_if1</text>
  <text x="300" y="302" text-anchor="middle" class="tiny">protbert</text>
  <text x="355" y="302" text-anchor="middle" class="tiny">protrek</text>

  <rect x="220" y="354" width="50" height="26" class="blockGrey"/>
  <rect x="275" y="354" width="50" height="26" class="blockGrey"/>
  <rect x="330" y="354" width="50" height="26" class="blockGrey"/>
  <text x="245" y="372" text-anchor="middle" class="tiny">rinalmo</text>
  <text x="300" y="372" text-anchor="middle" class="tiny">rna_fm</text>
  <text x="355" y="372" text-anchor="middle" class="tiny">rna_msm</text>

  <rect x="220" y="424" width="50" height="26" class="blockGrey"/>
  <rect x="275" y="424" width="50" height="26" class="blockGrey"/>
  <rect x="330" y="424" width="50" height="26" class="blockGrey"/>
  <text x="245" y="442" text-anchor="middle" class="tiny">ernie_rna</text>
  <text x="300" y="442" text-anchor="middle" class="tiny">rhofold</text>
  <text x="355" y="442" text-anchor="middle" class="tiny">rnabert</text>

  <text x="220" y="468" class="math">E^{g,m} ∈ ℝ^{N_chain × L_tok × d_m}</text>

  <!-- Panel 1: Structural tensors -->
  <rect x="55" y="470" width="350" height="250" class="blockGreen"/>
  <text x="70" y="495" class="label" font-weight="700">Structural Tensors (Residue-level, padded to L)</text>
  <text x="70" y="525" class="math">pos_atoms ∈ ℝ^{B × L × 4 × 3}</text>
  <text x="70" y="548" class="math">mask_atoms ∈ {0,1}^{B × L × 4}</text>
  <text x="70" y="571" class="math">restype, res_nb, chain_nb ∈ ℕ^{B × L}</text>
  <rect x="290" y="610" width="100" height="34" class="callout"/>
  <text x="340" y="632" text-anchor="middle" class="small" font-weight="700">patch_idx</text>
  <text x="70" y="610" class="tiny">(optional) structure-guided indexing for patch alignment</text>

  <!-- HTF internal blocks -->
  <text x="470" y="145" class="label" font-weight="700">HTF: Hierarchical Tri-Level Fusion</text>

  <!-- Level 1 -->
  <rect x="470" y="170" width="380" height="190" class="htfSub"/>
  <text x="485" y="194" class="label" font-weight="700">Level-1: Intra-Group Source-Attentive Fusion (S=3)</text>

  <!-- Four mini fusion boxes -->
  <rect x="485" y="210" width="170" height="62" class="blockGrey"/>
  <text x="570" y="232" text-anchor="middle" class="tiny" font-weight="700">prot_seq</text>
  <text x="495" y="254" class="tiny">3 sources → attn → F</text>

  <rect x="680" y="210" width="170" height="62" class="blockGrey"/>
  <text x="765" y="232" text-anchor="middle" class="tiny" font-weight="700">prot_struct</text>
  <text x="690" y="254" class="tiny">3 sources → attn → F</text>

  <rect x="485" y="284" width="170" height="62" class="blockGrey"/>
  <text x="570" y="306" text-anchor="middle" class="tiny" font-weight="700">rna_seq</text>
  <text x="495" y="328" class="tiny">3 sources → attn → F</text>

  <rect x="680" y="284" width="170" height="62" class="blockGrey"/>
  <text x="765" y="306" text-anchor="middle" class="tiny" font-weight="700">rna_struct</text>
  <text x="690" y="328" class="tiny">3 sources → attn → F</text>

  <text x="485" y="356" class="math">F^{g} ∈ ℝ^{B × T × D}</text>

  <!-- Level 2 -->
  <rect x="470" y="380" width="380" height="150" class="htfSub2"/>
  <text x="485" y="404" class="label" font-weight="700">Level-2: Intra-Entity Bidirectional Seq↔Struct Alignment</text>

  <rect x="485" y="420" width="170" height="80" class="blockGrey"/>
  <text x="570" y="442" text-anchor="middle" class="tiny" font-weight="700">Protein Alignment</text>
  <path d="M505 465 L635 465" class="bi"/>
  <text x="570" y="486" text-anchor="middle" class="tiny">seq ↔ struct</text>

  <rect x="680" y="420" width="170" height="80" class="blockGrey"/>
  <text x="765" y="442" text-anchor="middle" class="tiny" font-weight="700">RNA Alignment</text>
  <path d="M700 465 L830 465" class="bi"/>
  <text x="765" y="486" text-anchor="middle" class="tiny">seq ↔ struct</text>

  <!-- Level 3 -->
  <rect x="470" y="550" width="380" height="170" class="htfSub3"/>
  <text x="485" y="574" class="label" font-weight="700">Level-3: Inter-Molecular Bidirectional Interaction (Protein ↔ RNA)</text>

  <rect x="485" y="596" width="170" height="86" class="blockGrey"/>
  <text x="570" y="620" text-anchor="middle" class="tiny" font-weight="700">Protein Entity</text>
  <text x="570" y="642" text-anchor="middle" class="tiny">P ∈ ℝ^{B×L_p×D}</text>

  <rect x="680" y="596" width="170" height="86" class="blockGrey"/>
  <text x="765" y="620" text-anchor="middle" class="tiny" font-weight="700">RNA Entity</text>
  <text x="765" y="642" text-anchor="middle" class="tiny">R ∈ ℝ^{B×L_r×D}</text>

  <path d="M660 640 L680 640" class="bi"/>
  <text x="670" y="614" text-anchor="middle" class="tiny" font-weight="700">HFI</text>

  <!-- Patch alignment callout -->
  <rect x="500" y="694" width="320" height="22" class="callout"/>
  <text x="660" y="710" text-anchor="middle" class="tiny">Structure-guided patch-aligned token selection via patch_idx</text>

  <!-- From embeddings/structure to HTF arrows -->
  <path d="M405 300 L450 300" class="arrow"/>
  <text x="424" y="286" text-anchor="middle" class="math">E (12×)</text>

  <path d="M405 600 L450 600" class="arrowThin"/>
  <text x="424" y="586" text-anchor="middle" class="math">pos_atoms, mask</text>

  <!-- patch_idx indexing arrow -->
  <path d="M390 627 L470 705" class="idx"/>

  <!-- Panel 3: GPSE + CoFormer -->
  <rect x="910" y="160" width="390" height="160" class="blockGreen"/>
  <text x="926" y="184" class="label" font-weight="700">GPSE: Geometric Pairwise Structure Encoder</text>
  <text x="926" y="212" class="math">Z ∈ ℝ^{B × L × L × d_pair}</text>
  <text x="926" y="238" class="tiny">Inputs: pos_atoms, mask_atoms, restype, res_nb, chain_nb</text>

  <rect x="910" y="360" width="390" height="260" class="coformer"/>
  <text x="926" y="386" class="label" font-weight="700">CoFormer: Cross-Modal Complex Encoder (N blocks)</text>

  <!-- Stacked layers -->
  <rect x="930" y="410" width="350" height="36" class="encoderLayer"/>
  <rect x="930" y="452" width="350" height="36" class="encoderLayer"/>
  <rect x="930" y="494" width="350" height="36" class="encoderLayer"/>
  <rect x="930" y="536" width="350" height="36" class="encoderLayer"/>
  <rect x="930" y="578" width="350" height="36" class="encoderLayer"/>

  <text x="1105" y="433" text-anchor="middle" class="tiny">Transformer Block</text>
  <text x="1105" y="475" text-anchor="middle" class="tiny">Transformer Block</text>
  <text x="1105" y="517" text-anchor="middle" class="tiny">Transformer Block</text>
  <text x="1105" y="559" text-anchor="middle" class="tiny">Transformer Block</text>
  <text x="1105" y="601" text-anchor="middle" class="tiny">Transformer Block</text>

  <text x="926" y="642" class="math">H ∈ ℝ^{B × L × d}</text>

  <!-- HTF to CoFormer arrow -->
  <path d="M870 520 L910 520" class="arrow"/>
  <text x="890" y="505" text-anchor="middle" class="math">X ∈ ℝ^{B×L×d}</text>

  <!-- Structure to GPSE arrow -->
  <path d="M870 240 L910 240" class="arrowThin"/>
  <text x="890" y="226" text-anchor="middle" class="math">pos_atoms</text>

  <!-- GPSE to CoFormer arrow -->
  <path d="M1105 320 L1105 360" class="arrow"/>
  <text x="1126" y="346" class="math">Z</text>

  <!-- Panel 4: Heads -->
  <rect x="1360" y="200" width="190" height="60" class="blockGrey"/>
  <text x="1455" y="226" text-anchor="middle" class="label" font-weight="700">Pooling</text>
  <text x="1455" y="248" text-anchor="middle" class="math">h = Pool(H) ∈ ℝ^{B×d}</text>

  <path d="M1300 520 L1360 230" class="arrow"/>

  <!-- Main head -->
  <rect x="1360" y="300" width="190" height="95" class="blockGrey"/>
  <text x="1455" y="326" text-anchor="middle" class="label" font-weight="700">Main Regression Head (MLP)</text>
  <text x="1455" y="352" text-anchor="middle" class="math">ŷ ∈ ℝ^{B}</text>
  <circle cx="1540" cy="365" r="6" fill="#111827"/>

  <path d="M1455 260 L1455 300" class="arrow"/>

  <!-- PIA head -->
  <rect x="1360" y="425" width="190" height="190" class="blockGrey"/>
  <text x="1455" y="450" text-anchor="middle" class="label" font-weight="700">PIA (Auxiliary)</text>
  <text x="1455" y="472" text-anchor="middle" class="tiny">Physics-Informed Auxiliary Decomposition</text>

  <rect x="1375" y="490" width="160" height="28" class="callout"/>
  <rect x="1375" y="525" width="160" height="28" class="callout"/>
  <rect x="1375" y="560" width="160" height="28" class="callout"/>
  <rect x="1375" y="595" width="160" height="28" class="callout"/>

  <text x="1455" y="509" text-anchor="middle" class="tiny">Contact</text>
  <text x="1455" y="544" text-anchor="middle" class="tiny">Electrostatics</text>
  <text x="1455" y="579" text-anchor="middle" class="tiny">Hydrophobic</text>
  <text x="1455" y="614" text-anchor="middle" class="tiny">Stacking</text>
  <text x="1455" y="645" text-anchor="middle" class="math">ŷ_phys^k ∈ ℝ^{B}</text>

  <path d="M1455 260 L1455 425" class="arrowDashed"/>

  <!-- Legend -->
  <rect x="1100" y="720" width="470" height="110" class="legendBox"/>
  <text x="1120" y="745" class="label" font-weight="700">Legend</text>

  <line x1="1120" y1="770" x2="1200" y2="770" class="arrow"/>
  <text x="1215" y="774" class="tiny">Main data flow</text>

  <line x1="1120" y1="795" x2="1200" y2="795" class="arrowDashed"/>
  <text x="1215" y="799" class="tiny">Auxiliary branch (PIA)</text>

  <line x1="1120" y1="820" x2="1200" y2="820" class="bi"/>
  <text x="1215" y="824" class="tiny">Bidirectional attention / interaction</text>

  <line x1="1370" y1="770" x2="1450" y2="770" class="idx"/>
  <text x="1465" y="774" class="tiny">Indexing / patch alignment</text>

  <rect x="1370" y="792" width="20" height="14" class="htfSub3"/>
  <text x="1396" y="803" class="tiny">HTF novel component</text>

</svg>
