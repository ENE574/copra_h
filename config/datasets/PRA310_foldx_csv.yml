# PRA310 with PIA labels from precomputed FoldX CSV.
# Generate CSV (uses bundled foldx/foldx_20270131 by default):
#   python scripts/precompute_pra310_foldx_pia_terms.py

dataset_type: 'structure_dataset'
df_path: '/media/SSD0/csd/lrg/datasets/PRA310/splits/PRA310.csv'
batch_size: 8
data_root: '/media/SSD0/csd/lrg/datasets/PRA310/PDBs'
num_workers: 0
col_prot_chain: 'Protein chains'
col_na_chain: 'RNA chains'
col_prot: 'Protein sequences'
col_na: 'RNA sequences'
col_label: '△G(kcal/mol)'
pin_memory: True
cache_dir: '/media/SSD0/csd/lrg/cache/pra310_foldx_csv'
loss_type: regression
strategy: separate

use_offline_embeddings: true
offline_embedding_root: '/media/SSD0/csd/lrg/outputs/feature_extraction_PRA310'

# CSV columns: Electro, Energy_SolvP, Energy_SolvH, Energy_VdW (see scripts/precompute_pra310_foldx_pia_terms.py)
physics_targets_csv: '/media/SSD0/csd/lrg/datasets/PRA310/splits/PRA310_foldx_pia_terms.csv'

transform:
  - type: select_atom
    resolution: backbone
  - type: selected_region_with_distmap
    patch_size: 256
  - type: subtract_center_of_mass
