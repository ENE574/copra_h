dataset_type: 'structure_dataset'
df_path: '/media/SSD0/csd/lrg/copra_h/datasets/PRA310/splits/PRA310.csv'
batch_size: 8
data_root: '/media/SSD0/csd/lrg/copra_h/datasets/PRA310/PDBs'
num_workers: 0
col_prot_chain: 'Protein chains'
col_na_chain: 'RNA chains'
col_prot: 'Protein sequences'
col_na: 'RNA sequences'
col_label: '△G(kcal/mol)'
pin_memory: True
cache_dir: '/media/SSD0/csd/lrg/copra_h/cache/pra310'
loss_type: regression
strategy: separate

# PIA: physics target labels (FoldX 5 terms)
physics_targets_csv: '/media/SSD0/csd/lrg/copra_h/datasets/PRA310/splits/PRA310_foldx_pia_terms.csv'
physics_aux_terms:
  - Electro
  - Energy_SolvP
  - Energy_SolvH
  - Energy_VdW
  - Energy_Hbond

# Use precomputed embeddings (4 models, 4 groups: esm2 / esm_if1 / rna_fm / rhofold)
use_offline_embeddings: true
offline_embedding_root: '/media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_PRA310'
seq_prot_models:
  - esm2
seq_rna_models:
  - rna_fm
str_prot_models:
  - esm_if1
str_rna_models:
  - rhofold

transform:
  - type: select_atom
    resolution: backbone
  - type: selected_region_with_distmap
    patch_size: 256

  - type: subtract_center_of_mass
