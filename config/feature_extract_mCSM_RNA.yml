# mCSM_RNA offline embeddings (same 12-model layout as feature_extract_PRA310).
# Weights root: /media/SSD0/csd/lrg/copra_h/weights
# Run from repo root:
#   python extract_features.py --config config/feature_extract_mCSM_RNA.yml
#
# Splits: merges crossvalidation + blindtest (deduped on PDB + MUTATION).
# Mutant PDB resolution follows StructureDataset._resolve_pdb_path (mut=True).

device: cuda
output_dir: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_mCSM_RNA

dataset:
  csv_path: /media/SSD0/csd/lrg/copra_h/datasets/mCSM_RNA/splits/crossvalidation.csv
  extra_csv_paths:
    - /media/SSD0/csd/lrg/copra_h/datasets/mCSM_RNA/splits/blindtest.csv
  pdb_dir: /media/SSD0/csd/lrg/copra_h/datasets/mCSM_RNA/PDBs
  id_col: PDB
  mutation_col: MUTATION
  protein_seq_col: Protein sequences
  rna_seq_col: RNA sequences

protein_sequence:
  fasta:
  models:
    esm2:
      enabled: true
      model_location: /media/SSD0/csd/lrg/copra_h/weights/esm-2_weights/esm2_t33_650M_UR50D.pt
      repr_layer:
      batch_size: 1
    prott5:
      enabled: true
      model_dir: /media/SSD0/csd/lrg/copra_h/weights/ProtT5_weights
      batch_size: 1
    saprot:
      enabled: true
      model_dir: /media/SSD0/csd/lrg/copra_h/weights/SaProt_weights
      batch_size: 1

protein_structure:
  pdb_dir:
  models:
    esm_if1:
      enabled: true
      model_location: /media/SSD0/csd/lrg/copra_h/weights/esm-if1_weights/esm_if1_gvp4_t16_142M_UR50.pt
      chain_id:
    proteinmpnn:
      enabled: false
    protbert:
      enabled: true
      model_dir: /media/SSD0/csd/lrg/copra_h/weights/ProtBert_weights
      batch_size: 1
    alphafold2:
      enabled: false
      fasta:
      output_dir:
      data_dir: weights/AlphaFold2_weights
      model_preset: monomer
      db_preset: reduced_dbs
      max_template_date: "2020-05-14"
      use_gpu_relax: false
    protrek:
      enabled: true
      model_dir: /media/SSD0/csd/lrg/copra_h/weights/ProTrek_weights
      from_checkpoint: /media/SSD0/csd/lrg/copra_h/weights/ProTrek_weights/ProTrek_650M.pt
      protein_config: /media/SSD0/csd/lrg/copra_h/weights/ProTrek_weights/esm2_t33_650M_UR50D
      text_config: /media/SSD0/csd/lrg/copra_h/weights/ProTrek_weights/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
      structure_config: /media/SSD0/csd/lrg/copra_h/weights/ProTrek_weights/foldseek_t30_150M
      # If missing, extractors also try nested release and `which foldseek`.
      foldseek_bin: ProTrek/bin/foldseek
      batch_size: 32
      chain_id:

rna_sequence:
  fasta:
  models:
    rinalmo:
      enabled: true
      model_weights: /media/SSD0/csd/lrg/copra_h/weights/rinalmo_weights/rinalmo_giga_pretrained.pt
      rinalmo_type: "650M"
      batch_size: 1
    rna_fm:
      enabled: true
      model_path: /media/SSD0/csd/lrg/copra_h/weights/RNA-FM_weights/RNA-FM_pretrained.pth
      repr_layer:
      batch_size: 1
    rna_msm:
      enabled: true
      root_path: .
      msa_path: RNA-MSM/results
      msa_list:
      model_path: /media/SSD0/csd/lrg/copra_h/weights/RNA-MSM_weights/RNA_MSM_pretrained.ckpt
      extra_overrides:

rna_structure:
  fasta:
  models:
    rna_ernie:
      enabled: true
      model_dir: /media/SSD0/csd/lrg/copra_h/weights/RNAErnie_weights
      vocab_path: RNAErnie/data/vocab/vocab_1MER.txt
      batch_size: 16
      max_seq_len: 512
      device: gpu
    rnabert:
      enabled: true
      model_weights: /media/SSD0/csd/lrg/copra_h/weights/RNABERT_weights/bert_mul_2.pth
      batch_size: 40
      device: cpu
    rhofold:
      enabled: true
      ckpt_path: /media/SSD0/csd/lrg/copra_h/weights/RhFold_weights/model_20221010_params.pt
      input_a3m:
      single_seq_pred: true
      device: cuda
      # RhoFold's bundled RNA-FM is capped (~1024 positions); long RNAs otherwise crash in embed_positions.
      max_rna_length: 1000
      truncate_rna: true
      # RhoFold e2eformer attention memory grows ~O(L^2); above this length skip CUDA (use CPU only).
      # Set to 0 to always try CUDA first (may OOM on ~24GB cards around L≈800–1000).
      cuda_safe_max_rna_length: 512
