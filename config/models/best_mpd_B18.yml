# MPD B18: B15 replica with different seed + slightly lower lr + stronger weight_decay
resume: null
model:
  model_type: copra
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_MPD_merged
  seq_prot_models:
    - esm2
  seq_dna_models:
    - dnabert2
  str_prot_models:
    - esm_if1
  str_dna_models:
    - rf2na
  pooling: token
  mutation_diff_mode: local
  mutation_local_window: 32
  mutation_local_pool: center
  mutation_ddg_use_struct: true
  mutation_local_gnn: true
  mutation_local_gnn_k: 8
  mutation_local_gnn_layers: 2
  mutation_ddg_wt_context_fuse: true
  output_dim: 1
  offline_dim: 1280
  pair_dim: 40
  dist_dim: 40
  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.0
    residual_dropout: 0.1
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard

train:
  temperature: 0.2
  max_iters: 50_000                      # B18: more steps for 100 epochs
  val_freq: 1000
  seed: 2025                             # B18: different seed, test replicability
  max_grad_norm: 100.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  huber_delta: 1.0                       # B18: same as B15
  # === pred_std_reg: same moderate level as B15 ===
  ddg_pred_std_floor: 0.4
  ddg_pred_std_reg_weight: 0.5
  # === complex-demeaned + ranking: same as B15 ===
  complex_demeaned_loss_weight: 2.0
  complex_demean_min_group_size: 2
  ranking_loss_weight: 2.0
  ranking_loss_margin: 0.5
  accum_window_loss: true
  # === regularization ===
  input_noise_scale: 0.02                # B18: same as B15
  # === physics aux (same as B15) ===
  physics_aux_terms:
    - Electro
    - Energy_SolvP
    - Energy_SolvH
    - Energy_VdW
    - Energy_Hbond
  physics_aux_standardize: true
  physics_aux_clip: 0.0
  physics_aux_stop_grad: true
  physics_aux_start_epoch: 10
  physics_aux_prob: 1.0
  physics_aux_max_weight: 0.005
  physics_aux_warmup_epochs: 3
  physics_aux_decay_epochs: 10
  physics_aux_min_weight: 0.0
  physics_aux_normalize: false
  optimizer:
    type: adam
    lr: 2.e-5                             # B18: 3e-5→2e-5, slower convergence for stability
    weight_decay: 5.0e-06                 # B18: 1e-6→5e-6, stronger L2 regularization
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 15                          # B18: 10→15, longer patience
    min_lr: 1.e-7
    monitor: train_loss
    mode: min
