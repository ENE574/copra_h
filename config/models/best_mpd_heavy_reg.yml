# B2: 强正则化对抗小数据过拟合。
# 策略: 大幅dropout + 高weight_decay + 降模型容量 + 降lr + 更密val + 早停
resume: null
model:
  model_type: copra
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_MPD_merged
  seq_prot_models:
    - esm2
  seq_dna_models:
    - dnabert2
  str_prot_models:
    - esm_if1
  str_dna_models:
    - rf2na
  pooling: token
  mutation_diff_mode: local
  mutation_local_window: 16
  mutation_local_pool: center
  mutation_ddg_use_struct: true
  mutation_local_gnn: true
  mutation_local_gnn_k: 4                # ← B2: 降邻居数 8→4
  mutation_local_gnn_layers: 1           # ← B2: 降GNN层数 2→1
  mutation_ddg_wt_context_fuse: true
  output_dim: 1
  offline_dim: 1280
  pair_dim: 40
  dist_dim: 40
  coformer:
    embed_dim: 256                        # ← B2: 降嵌入维度 320→256
    pair_dim: 40
    num_blocks: 5                         # ← B2: 降coformer块数 6→5
    num_heads: 16                         # ← B2: 降注意力头 20→16
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.4                # ← B2: 大幅↑ 0.2→0.4
    transition_dropout: 0.2               # ← B2: 新增 0.0→0.2
    residual_dropout: 0.3                 # ← B2: ↑ 0.1→0.3
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard

train:
  temperature: 0.2
  max_iters: 30_000
  val_freq: 500                          # ← B2: 更密验证 1000→500, 更快捕获峰值
  seed: 2024
  max_grad_norm: 50.0                    # ← B2: 更紧梯度裁剪 100→50
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  huber_delta: 1.0                       # ← B2: 更严Huber 2.0→1.0, 降极端值影响
  ddg_pred_std_floor: 0.0
  ddg_pred_std_reg_weight: 0.0
  physics_aux_terms:
    - Electro
    - Energy_SolvP
    - Energy_SolvH
    - Energy_VdW
    - Energy_Hbond
  physics_aux_standardize: true
  physics_aux_clip: 0.0
  physics_aux_stop_grad: true
  physics_aux_start_epoch: 5             # ← B2: 推迟physics辅助 0→5, 先让主任务稳定
  physics_aux_prob: 0.5                  # ← B2: 降低physics概率 1.0→0.5
  physics_aux_max_weight: 0.005          # ← B2: 降权 0.01→0.005
  physics_aux_warmup_epochs: 3
  physics_aux_decay_epochs: 10
  physics_aux_min_weight: 0.0
  physics_aux_normalize: false
  optimizer:
    type: adamw                          # ← B2: AdamW解耦wd, 更有效的L2正则
    lr: 2.e-5                            # ← B2: 降lr 5e-5→2e-5
    weight_decay: 5.0e-04                # ← B2: 大幅↑wd 1e-5→5e-4 (50x)
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.7                          # ← B2: 更激进衰减 0.8→0.7
    patience: 5                          # ← B2: 更快触发衰减 8→5
    min_lr: 5.e-7                        # ← B2: 更低底线 1e-6→5e-7
    monitor: val/all_pearson             # ← B2: 用val信号调度, 而非train_loss
    mode: max
