resume: null
model: 
  model_type: copra
  esm_type: 650M
  embedding_root: '/media/SSD0/csd/lrg/outputs/feature_extraction_PRA310'
  seq_prot_models:
    - esm2
    - prott5
    - saprot
  seq_rna_models:
    - rinalmo
    - rna_msm
    - rna_fm
  str_prot_models:
    - esm_if1
    - protrek
    - protbert
  str_rna_models:
    - rna_ernie
    - rnabert
    - rhofold
  pooling: token
  output_dim: 1
  fix_lms: true
  # If true, bypass online ESM/RiNALMo and use 12 offline embeddings provided by dataloader
  use_offline_embeddings: true
  # Unified feature dim for offline fusion/attention; must be divisible by coformer.num_heads
  offline_dim: 1280
  lora_tune: false
  lora_rank: 16
  lora_alpha: 32
  pair_dim: 40
  dist_dim: 40
  representation_layer: 33
  coformer: 
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.0
    residual_dropout: 0.1
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard

train:
  temperature: 0.2
  max_iters: 30_000
  val_freq: 1000
  seed: 2024
  max_grad_norm: 100.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  huber_delta: 2.0
  physics_aux_max_weight: 0.05
  physics_aux_warmup_epochs: 10
  physics_aux_decay_epochs: 20
  physics_aux_min_weight: 0.01
  physics_aux_normalize: false
  physics_aux_clip: 2.0
  physics_aux_stop_grad: true
  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 1.e-2
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 5
    min_lr: 1.e-6
