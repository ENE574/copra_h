model:
  model_type: copra
  stage: dG
  pooling: token
  output_dim: 1
  offline_dim: 1280
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_PRA310
  seq_prot_models: [esm2]
  seq_rna_models: [rna_fm]
  str_prot_models: [esm_if1]
  str_rna_models: [rhofold]
  pair_dim: 40
  dist_dim: 40
  coformer:
    embed_dim: 320
    num_blocks: 6
    num_heads: 20
    pair_dim: 40
    attention_type: standard
    attention_dropout: 0.1
    residual_dropout: 0.1
    transition_dropout: 0.0
    transition_factor: 4
    attn_qkv_bias: false
    use_rot_emb: true
    use_flash_attn: false
  ddg_output_calibrate: true
  mutation_ddg_use_struct: true
  mutation_ddg_wt_context_fuse: true
  mutation_diff_mode: local
  mutation_local_gnn: true
  mutation_local_gnn_k: 8
  mutation_local_gnn_layers: 2
  mutation_local_pool: center
  mutation_local_window: 32
train:
  seed: 2024
  max_grad_norm: 100.0
  max_iters: 30000
  main_loss_type: mse
  standardize_label: true
  label_stats_from_data: true
  val_freq: 1000
  input_noise_scale: 0.025
  temperature: 0.2
  physics_aux_terms: [Electro, Energy_SolvP, Energy_SolvH, Energy_VdW, Energy_Hbond]
  physics_aux_standardize: true
  physics_aux_normalize: false
  physics_aux_max_weight: 0.004
  physics_aux_min_weight: 0.0
  physics_aux_warmup_epochs: 8
  physics_aux_decay_epochs: 12
  physics_aux_start_epoch: 25
  physics_aux_prob: 1.0
  physics_aux_clip: 0.0
  physics_aux_stop_grad: false
  accum_window_loss: true
  complex_demean_min_group_size: 2
  complex_demeaned_loss_weight: 0.0
  ddg_pred_std_floor: 0.0
  ddg_pred_std_reg_weight: 0.0
  ranking_loss_margin: 0.5
  ranking_loss_weight: 3.0
  optimizer:
    type: adam
    lr: 4.0e-05
    beta1: 0.9
    beta2: 0.999
    weight_decay: 1.0e-06
  scheduler:
    type: multistep
    milestones: [60, 110, 140]
    gamma: 0.5
    min_lr: 1.0e-07
    mode: min
    monitor: train_loss
