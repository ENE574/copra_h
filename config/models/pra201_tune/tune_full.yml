resume: null
model:
  model_type: copra
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_PRA310
  seq_prot_models:
  - esm2
  seq_rna_models:
  - rna_fm
  str_prot_models:
  - esm_if1
  str_rna_models:
  - rhofold
  pooling: token
  mutation_diff_mode: local
  mutation_local_window: 32
  mutation_local_pool: center
  mutation_ddg_use_struct: true
  mutation_local_gnn: true
  mutation_local_gnn_k: 8
  mutation_local_gnn_layers: 2
  mutation_ddg_wt_context_fuse: true
  output_dim: 1
  offline_dim: 1280
  pair_dim: 40
  dist_dim: 40
  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.0
    residual_dropout: 0.1
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard
  ddg_output_calibrate: true
train:
  temperature: 0.2
  max_iters: 30000
  val_freq: 1000
  seed: 2025
  max_grad_norm: 100.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  ddg_pred_std_floor: 0.0
  ddg_pred_std_reg_weight: 0.0
  complex_demeaned_loss_weight: 0.0
  complex_demean_min_group_size: 2
  ranking_loss_weight: 1.0
  ranking_loss_margin: 0.5
  accum_window_loss: true
  input_noise_scale: 0.01
  physics_aux_standardize: true
  physics_aux_clip: 20.0
  physics_aux_stop_grad: false
  physics_aux_start_epoch: 0
  physics_aux_prob: 1.0
  physics_aux_max_weight: 0.0005
  physics_aux_warmup_epochs: 3
  physics_aux_decay_epochs: 5
  physics_aux_min_weight: 0.0
  physics_aux_normalize: false
  optimizer:
    type: adam
    lr: 3.0e-05
    weight_decay: 1.0e-06
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: multistep
    milestones:
    - 8000
    - 16000
    - 24000
    gamma: 0.5
    min_lr: 1.0e-07
    monitor: train_loss
    mode: min
  huber_delta: 1.0
