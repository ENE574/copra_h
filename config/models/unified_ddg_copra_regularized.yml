# Unified ddG Fine-tuning — STRONG regularization for small datasets
# Match pretrained model config exactly

resume: null
task_profile: ddg_unified
model:
  model_type: copra
  use_diff_pred: true
  esm_type: 650M
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_SKEMPI
  use_offline_embeddings: true
  offline_dim: 1280
  fix_lms: true
  lora_tune: false
  pooling: token
  output_dim: 1
  pair_dim: 40
  dist_dim: 40
  representation_layer: 33

  seq_prot_models: [esm2]
  str_prot_models: [esm_if1]
  seq_rna_models: [rna_fm]
  str_rna_models: [rhofold]
  seq_dna_models: [dnabert2]
  str_dna_models: [rf2na]

  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.3
    transition_dropout: 0.2
    residual_dropout: 0.3
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard

  mutation_diff_mode: local
  mutation_local_window: 16
  mutation_local_pool: center
  mutation_ddg_use_struct: true
  mutation_local_gnn: true
  mutation_local_gnn_k: 8
  mutation_local_gnn_layers: 2
  mutation_ddg_wt_context_fuse: false

train:
  temperature: 0.2
  max_iters: 40_000
  val_freq: 1000
  seed: 2024
  max_grad_norm: 100.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  huber_delta: 2.0

  input_noise_scale: 0.02
  reverse_aug_prob: 0.5

  physics_aux_max_weight: 0.0
  physics_aux_prob: 0.0

  complex_demeaned_loss_weight: 1.0
  complex_demean_min_group_size: 2

  ranking_loss_weight: 0.5

  optimizer:
    type: adam
    lr: 1.e-5
    weight_decay: 1.e-2
    beta1: 0.9
    beta2: 0.999
    freeze_backbone: true
  scheduler:
    type: plateau
    factor: 0.5
    patience: 5
    min_lr: 1.e-7