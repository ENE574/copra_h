# Unified ddG Fine-tuning — strong regularization for ddG tasks
# After pre-training with unified_ddg_pretrain.yml, fine-tune per dataset with:
# - freeze_backbone=true (only train prediction heads)
# - Higher weight_decay for strong regularization
# - Stronger dropout
# - Complex-demeaned loss and ranking loss

resume: null
task_profile: ddg_unified
model:
  model_type: copra_offline12
  use_diff_pred: true
  esm_type: 650M
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_SKEMPI
  use_offline_embeddings: true
  offline_dim: 1280
  fix_lms: true
  lora_tune: false
  pooling: token
  output_dim: 1
  pair_dim: 40
  dist_dim: 40
  representation_layer: 33

  seq_prot_models: [esm2]
  str_prot_models: [esm_if1]
  seq_rna_models: [rna_fm]
  str_rna_models: [rhofold]
  seq_dna_models: [dnabert2]
  str_dna_models: [rf2na]

  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.2
    transition_dropout: 0.3
    residual_dropout: 0.3
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard

train:
  temperature: 0.2
  max_iters: 40_000
  val_freq: 1000
  seed: 2024
  max_grad_norm: 100.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  huber_delta: 2.0

  input_noise_scale: 0.005
  reverse_aug_prob: 0.2

  # Physics aux loss for regularization
  physics_aux_max_weight: 0.02
  physics_aux_prob: 1.0
  physics_aux_terms:
    - Electro
    - Energy_SolvP
    - Energy_SolvH
    - Energy_VdW
    - Energy_Hbond
    - DNA_Electro
    - DNA_Stacking
    - DNA_VDW
  physics_aux_standardize: true
  physics_aux_start_epoch: 0
  physics_aux_warmup_epochs: 3
  physics_aux_decay_epochs: 10
  physics_aux_min_weight: 0.005
  physics_aux_normalize: false

  # Complex-demeaned loss for within-complex ranking
  complex_demeaned_loss_weight: 0.5
  complex_demean_min_group_size: 2

  # Pairwise ranking loss
  ranking_loss_weight: 0.2

  optimizer:
    type: adam
    lr: 5.e-5
    weight_decay: 1.e-2
    beta1: 0.9
    beta2: 0.999
    freeze_backbone: false
  scheduler:
    type: plateau
    factor: 0.7
    patience: 5
    min_lr: 1.e-7
