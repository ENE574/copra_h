# Unified framework — MPD protein-DNA ΔΔG (mCSM prot-NA mutation path).
resume: null
task_profile: ddg_prot_na_mpd
model:
  model_type: copra
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_MPD_merged
  seq_prot_models: [esm2]
  seq_dna_models: [nucleotide_transformer]
  str_prot_models: [esm_if1]
  str_dna_models: [rf2na]
  pooling: token
  output_dim: 1
  fix_lms: true
  use_offline_embeddings: true
  offline_dim: 1024
  pair_dim: 40
  dist_dim: 40
  representation_layer: 33
  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 16
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.1
    residual_dropout: 0.2
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard

train:
  max_iters: 30_000
  val_freq: 1000
  seed: 2024
  max_grad_norm: 100.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  huber_delta: 1.5
  physics_aux_terms:
    - Electro
    - Energy_SolvP
    - Energy_SolvH
    - Energy_VdW
    - Energy_Hbond
    - DNA_Electro
    - DNA_Stacking
    - DNA_VDW
  physics_aux_standardize: true
  physics_aux_clip: 0.0
  physics_aux_start_epoch: 0
  physics_aux_prob: 1.0
  physics_aux_max_weight: 0.05
  physics_aux_warmup_epochs: 3
  physics_aux_decay_epochs: 10
  physics_aux_min_weight: 0.005
  physics_aux_normalize: false
  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 1.e-3
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 12
    min_lr: 1.e-6
    monitor: val/all_pearson
    mode: max
