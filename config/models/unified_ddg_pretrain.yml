# Unified ddG Pre-training — multi-entity mutation effect prediction.
# Supports: PPI ddG (SKEMPI), protein-RNA ddG (mCSM), protein-DNA ddG (MPD).
# The backbone and ddG head are trained jointly across all datasets.
# After pre-training, fine-tune per dataset with freeze_backbone=true.
#
# Usage:
#   python run.py finetune ddG \
#       --model_config config/models/unified_ddg_pretrain.yml \
#       --data_config config/datasets/SKEMPI.yml \
#       --run_config config/runs/unified_ddg_pretrain.yml

resume: null
task_profile: ddg_unified
model:
  model_type: copra
  esm_type: 650M
  # Default embedding_root (each dataset in multitask_sources provides its own)
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_SKEMPI
  use_offline_embeddings: true
  offline_dim: 1280
  fix_lms: true
  lora_tune: false
  pooling: token
  output_dim: 1
  pair_dim: 40
  dist_dim: 40
  representation_layer: 33

  # All embedding types — union of PPI, prot-RNA, and prot-DNA
  # Protein entity A (shared across all datasets)
  seq_prot_models: [esm2]
  str_prot_models: [esm_if1]
  # Entity B: RNA models (for mCSM: rna_fm + rhofold)
  seq_rna_models: [rna_fm]
  str_rna_models: [rhofold]
  # Entity B: DNA models (for MPD: dnabert2 + rf2na)
  seq_dna_models: [dnabert2]
  str_dna_models: [rf2na]

  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.1
    residual_dropout: 0.2
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard

train:
  temperature: 0.2
  max_iters: 40_000
  val_freq: 1000
  seed: 2024
  max_grad_norm: 100.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  huber_delta: 2.0

  # Physics aux loss for regularization (thermodynamic constraints)
  physics_aux_max_weight: 0.01
  physics_aux_prob: 1.0
  physics_aux_terms:
    - Electro
    - Energy_SolvP
    - Energy_SolvH
    - Energy_VdW
    - Energy_Hbond
    - DNA_Electro
    - DNA_Stacking
    - DNA_VDW
  physics_aux_standardize: true
  physics_aux_start_epoch: 0
  physics_aux_warmup_epochs: 3
  physics_aux_decay_epochs: 10
  physics_aux_min_weight: 0.005
  physics_aux_normalize: false

  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 1.e-3
    beta1: 0.9
    beta2: 0.999
    freeze_backbone: false
  scheduler:
    type: plateau
    factor: 0.8
    patience: 8
    min_lr: 1.e-6
