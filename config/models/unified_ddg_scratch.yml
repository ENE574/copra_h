# Unified ddG Fine-tuning — no pretrained, simple model
# Data is very small (134 training samples), start from scratch

resume: null
task_profile: ddg_unified
model:
  model_type: copra_offline12
  use_diff_pred: true
  esm_type: 650M
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_SKEMPI
  use_offline_embeddings: true
  offline_dim: 1280
  fix_lms: true
  lora_tune: false
  pooling: token
  output_dim: 1
  pair_dim: 40
  dist_dim: 40
  representation_layer: 33
  d_model: 320
  num_heads: 8

  seq_prot_models: [esm2]
  str_prot_models: [esm_if1]
  seq_rna_models: [rna_fm]
  str_rna_models: [rhofold]
  seq_dna_models: [dnabert2]
  str_dna_models: [rf2na]

train:
  temperature: 0.2
  max_iters: 40_000
  val_freq: 1000
  seed: 2024
  max_grad_norm: 10.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: mse

  input_noise_scale: 0.0
  reverse_aug_prob: 0.0

  physics_aux_max_weight: 0.0
  physics_aux_prob: 0.0

  complex_demeaned_loss_weight: 0.0
  complex_demean_min_group_size: 2

  ranking_loss_weight: 0.0

  optimizer:
    type: adam
    lr: 1.e-4
    weight_decay: 0.0
    beta1: 0.9
    beta2: 0.999
    freeze_backbone: false
  scheduler:
    type: plateau
    factor: 0.5
    patience: 5
    min_lr: 1.e-7