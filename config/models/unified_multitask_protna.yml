# Multi-task ddG: mCSM-RNA + MPD (shared CoFormer, prot-NA mutation heads).
# Set multitask_sources in run config; each source keeps its own embeddings root via dataset yaml.
resume: null
task_profile: ddg_prot_na_mcsm
model:
  model_type: copra
  embedding_root: /media/SSD0/csd/lrg/copra_h/outputs/feature_extraction_mCSM_RNA
  seq_prot_models: [esm2]
  seq_rna_models: [rna_fm]
  str_prot_models: [esm_if1]
  str_rna_models: [rhofold]
  pooling: token
  output_dim: 1
  fix_lms: true
  use_offline_embeddings: true
  offline_dim: 1280
  pair_dim: 40
  dist_dim: 40
  representation_layer: 33
  coformer:
    embed_dim: 320
    pair_dim: 40
    num_blocks: 6
    num_heads: 20
    use_rot_emb: true
    attn_qkv_bias: false
    attention_dropout: 0.1
    transition_dropout: 0.0
    residual_dropout: 0.1
    transition_factor: 4
    use_flash_attn: false
    attention_type: standard

train:
  max_iters: 30_000
  val_freq: 1000
  seed: 2024
  max_grad_norm: 100.0
  standardize_label: true
  label_stats_from_data: true
  main_loss_type: huber
  huber_delta: 2.0
  multitask_sampling: proportional
  physics_aux_terms:
    - Electro
    - Energy_SolvP
    - Energy_SolvH
    - Energy_VdW
    - Energy_Hbond
  physics_aux_standardize: true
  physics_aux_clip: 0.0
  physics_aux_stop_grad: true
  physics_aux_start_epoch: 0
  physics_aux_prob: 1.0
  physics_aux_max_weight: 0.01
  physics_aux_warmup_epochs: 3
  physics_aux_decay_epochs: 10
  physics_aux_min_weight: 0.0
  physics_aux_normalize: false
  interface_aux_weight: 0.05
  optimizer:
    type: adam
    lr: 8.e-5
    weight_decay: 1.e-4
    beta1: 0.9
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.8
    patience: 6
    min_lr: 1.e-6
    monitor: val/all_pearson
    mode: max
