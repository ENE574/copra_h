# ============================================================
# DDG Fine-tuning on MPD (DNA ΔΔG) — single fold with split
# Stage 2c: Load backbone + DDG from pretrain_ddg_skempi,
#           freeze backbone, single fold (split column handles CV)
#           PPI pre-trained DDG → DNA ddG (cross-interaction transfer)
# ============================================================
epochs: 150
patience: 30
output_dir: '/media/SSD0/csd/lrg/copra_h/outputs/finetune_ddg_mpd'
gpus:
  - 0

# ⚠ REPLACE with the actual checkpoint path from pretrain_ddg_skempi step 1
# e.g. outputs/pretrain_ddg_skempi/pretrain_ddg_skempi_YYYY-MM-DD-HH-MM-SS/log_fold_0/checkpoint/best-epoch=*-val/all_pearson=*.ckpt
ckpt: 'REPLACE_WITH_PRETRAIN_DDG_SKEMPI_CKPT'

run_name: 'finetune_ddg_mpd_'
wandb: false
num_folds: 1

accumulate_grad_batches: 8
checkpoint_monitor: val/all_rmse
checkpoint_mode: min
early_stop_monitor: val/all_rmse
early_stop_mode: min
