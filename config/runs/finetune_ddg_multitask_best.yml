# Unified ddG Fine-tuning — multi-task with best parameters
# Combine SKEMPI (3235 samples) + mCSM (213 samples) + MPD to increase data size
# Use best parameters from previous experiments

epochs: 500
patience: 50
output_dir: '/media/SSD0/csd/lrg/copra_h/outputs/finetune_ddg_multitask_best'
gpus:
  - 0

ckpt: null
run_name: 'finetune_ddg_multitask_best_'
wandb: false

num_folds: 1

multitask_primary_task: mcsm
multitask_sources:
  - name: skempi
    data_config: ./config/datasets/SKEMPI.yml
    batch_size: 1
  - name: mcsm
    data_config: ./config/datasets/mCSM.yml
    batch_size: 2
  - name: mpd
    data_config: ./config/datasets/MPD_pempni.yml
    batch_size: 1

accumulate_grad_batches: 32
checkpoint_monitor: val/all_rmse
checkpoint_mode: min
early_stop_monitor: val/all_rmse
early_stop_mode: min
