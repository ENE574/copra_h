# Single train on MPD276, single test on MPD48 (PEMPNI independent test).
epochs: 30
patience: 150
output_dir: '/media/SSD0/csd/lrg/copra_h/outputs/MPD_merged_pempni'
gpus:
  - 3

ckpt: null

run_name: 'mpd_pempni_'
wandb: false
num_folds: 1

accumulate_grad_batches: 8

# No val split: checkpoint/early-stop on train metrics; report test/all_pearson on MPD48.
checkpoint_monitor: train/all_rmse
checkpoint_mode: min
test_both_checkpoints: false
early_stop_monitor: train/all_rmse
early_stop_mode: min
