# MPD B16 run config: more epochs, fewer gradient accum steps for slow lr
epochs: 100                              # B16: 60→100, slow lr needs more epochs
patience: 200
output_dir: '/media/SSD0/csd/lrg/copra_h/outputs/MPD_merged_pdb_overlap'
gpus: [3]
ckpt: null
skip_test: true
run_name: 'mpd_pdb_overlap_B16_'
wandb: false
num_folds: 1
accumulate_grad_batches: 2               # B16: 4→2, more frequent updates (batch_size=4 → effective=8)
checkpoint_monitor: 'val/all_rmse'
