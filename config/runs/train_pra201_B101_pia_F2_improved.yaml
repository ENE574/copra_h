# Improved training run config for PRA201 (copra dG, PIA aux, 5-term)
# Runs on GPU 2 (single device, 5 folds serial). skip_test disabled so test
# inference metrics are produced automatically.
num_folds: 5
epochs: 150
patience: 40
gpus:
  - 2
ckpt: null
run_name: 'pra201_pia_F2_piafix_improved_'
output_dir: '/media/SSD0/csd/lrg/copra_h/outputs/PRA201_B101_pia_F2_improved'
wandb: false
accumulate_grad_batches: 4
checkpoint_monitor: val/all_rmse
checkpoint_mode: min
test_both_checkpoints: false
early_stop_monitor: val/all_rmse
early_stop_mode: min
skip_test: false
