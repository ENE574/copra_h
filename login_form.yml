                - heading "Sales Prices for PDBbind v.2025 in USD and EUR Adjusted (2026/06/12)" [level=2] [ref=e78]
                - paragraph [ref=e79]:
                  - paragraph [ref=e80]: Dear PDBbind Users,
                  - paragraph [ref=e81]: Since the release of PDBbind v.2025 in this February, exchange rates for the Chinese currency (CNY) have experienced significant fluctuations. While the sales price of PDBbind v.2025 in CNY remains unchanged, we have to adjust the prices in USD and EUR to ensure fair pricing for both domestic and international users. The new sales prices for PDBbind v.2025 in USD and EUR are now reflected in all invoices, sales contracts, and relevant pages on this website.
                  - paragraph [ref=e82]: Should currency exchange rates undergo non-negligible changes in the future, we may again adjust the prices accordingly. We greatly appreciate your understanding in this matter.
                  - paragraph [ref=e83]: Best regards,
                  - paragraph [ref=e84]: The PDBbind+ Team
                  - paragraph [ref=e85]: School of Pharmaceutical Sciences, Fudan University
                  - paragraph [ref=e86]: "& Shanghai TopScience Co., Ltd."
          - generic [ref=e88]:
            - generic [ref=e89]:
              - generic [ref=e90]: What is PDBbind+?
              - generic [ref=e91]: PDBbind+ is an enhanced and commercialized version of the original PDBbind-CN website (http://www.pdbbind.org.cn). This upgraded website is a collaborative project between Prof. Renxiao Wang's team at Fudan University and TopScience Co. Ltd in Shanghai (https://www.tsbiochem.com). The PDBbind+ web site is officially launched in January 2024.
            - generic [ref=e93]:
              - generic [ref=e94]:
                - generic [ref=e95]: What does PDBbind+ offer?
                - generic [ref=e96]: PDBbind+ serves as a web portal to the PDBbind database, which is developed by Prof. Renxiao Wang's team at the School of Pharmacy, Fudan University. The primary objective of the PDBbind database is to offer a comprehensive collection of experimental binding affinity data for all biomolecular complexes recorded in the Protein Data Bank (PDB). This database has been widely employed in various molecular modeling and machine-learning studies related to molecular recognition, drug discovery, and many more.
              - list [ref=e98]:
                - listitem [ref=e99]: On this web site, users can visually inspect, analyze, and search through the diverse complexes cataloged in the PDBbind database.
                - listitem [ref=e100]: Users are granted access to download the PDBbind data sets, which include carefully processed protein-ligand complex structures that are ready for use with computational software.
                - listitem [ref=e101]: This web site also incorporates valuable functional modules that leverage the contents of PDBbind and the Protein Data Bank. On-line job submission and computation are enabled with the support of cloud computing resources.
          - generic [ref=e103]:
            - generic [ref=e104]:
              - generic [ref=e105]: What is new in PDBbind version 2025?
              - generic [ref=e106]: "The current version of the PDBbind database on this web site is version 2025. As indicated by the version number, it is based on the contents of PDB available at the beginning of year 2025. This version has the following new features:"
              - generic [ref=e109]: Measurable Data Growth
              - generic [ref=e110]: The PDBbind database continues to expand. The total number of binding data entries in version 2025 has reached 35,924. This represents an approximate 7% increase compared to version 2024 and an increase of over 50% compared to the last free-accessible release (version 2020).
            - img [ref=e112]
          - generic [ref=e114]:
            - generic [ref=e115]:
              - generic [ref=e116]: What is new in PDBbind version 2025?
              - generic [ref=e119]: Refined Structural Processing & Quality Control
              - generic [ref=e120]: Each complex included in PDBbind comes with a set of processed structural files. To compile version 2025, we have further upgraded our processing workflow. This upgraded workflow has been applied not only to newly added entries but also to entries from the previous version.
            - img [ref=e122]
          - generic [ref=e124]:
            - generic [ref=e125]:
              - generic [ref=e126]: What is new in PDBbind version 2025?
              - generic [ref=e129]: Integration of New On-Line Computing Tool
              - generic [ref=e130]: In addition to COMET (target-fishing for bioactive molecules) and PLANET (ultra-fast structure-based virtual screening), the PDBbind+ platform has incorporated a new tool termed STELLAR. This deep-learning model is developed for the prediction of ligand dissociation rate constants (koff), a critical feature in protein-ligand binding.
            - img [ref=e132]
          - generic [ref=e134]:
            - generic [ref=e135]: Why to subscribe to PDBbind+?
            - generic [ref=e136]: "We have taken a significant step towards the commercialization of the PDBbind database starting from version 2021. The PDBbind+ web site serves as the exclusive gateway to both the current and forthcoming releases of the PDBbind database. Full access to the PDBbind database and the valuable features integrated into the PDBbind+ web site is reserved for paid subscribers. Nevertheless, it is FREE to register on the PDBbind+ web site. Upon completion of registration, the user is automatically designated as a demo user, providing him/her with limited access to the available features on PDBbind+. The distinctions between the benefits of a demo user and those of a paid subscriber are outlined below:"
